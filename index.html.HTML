<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mídia Indoor & Cardápio Digital Dinâmico</title>

    <!-- Fontes do Google (Montserrat e Inter para leitura clara na TV e no Telemóvel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Reset & Estilos de Base Globais -->
    <style>
      /* Reset Básico */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Configuração para Ecrã Cheiro e Bloqueio de Scroll Indesejado na TV */
      html, body {
        width: 100%;
        height: 100%;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Contentor Principal da Aplicação */
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      /* Classe utilitária para o modo Painel Mobile com Scroll habilitado */
      body.admin-mode {
        overflow-y: auto !important;
        background-color: #121212;
      }

      /* Ecrã de Carregamento Inicial (Loader) */
      #initial-loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #d4af37; /* Cor Ouro / Gutenberg */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-text {
        margin-top: 20px;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #888888;
      }
    </style>
  </head>
  <body>
    <!-- Contentor onde a aplicação React / Vue / JS Nativo irá injetar as vistas -->
    <div id="app">
      <!-- Indicador de Carregamento até os dados do tenant serem sincronizados -->
      <div id="initial-loader">
        <div class="spinner"></div>
        <p class="loader-text">A carregar sistema...</p>
      </div>
    </div>

    <!-- Ponto de Entrada do Código JavaScript/TypeScript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
